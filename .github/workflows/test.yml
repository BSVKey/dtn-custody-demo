name: test
on:
  push:
  pull_request:
jobs:
  offline-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node --test
      - run: node run-demo.mjs
      - run: for p in contact-plans/*.json; do node run-demo.mjs --plan "$p" > /dev/null; done
